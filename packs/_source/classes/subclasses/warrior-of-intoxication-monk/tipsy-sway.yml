  description:
    value: >-
      <p>You can move in sudden, swaying ways. You gain the following
      benefits.</p><p><em><strong>Leap to Your Feet.</strong></em> When you have
      the &amp;Reference[Prone apply=false] condition, you can stand up by
      spending 5 feet of movement, rather than half your
      Speed.</p><p><em><strong>Redirect Attack.</strong></em> When a creature
      misses you with a melee attack roll, you can spend 1 Focus Point as a
      Reaction to cause that attack to hit one creature of your choice, other
      than the attacker, that you can see within 5 feet of yourself.</p>
