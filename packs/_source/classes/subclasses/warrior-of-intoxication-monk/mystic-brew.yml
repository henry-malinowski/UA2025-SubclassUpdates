  description:
    value: >-
      <p>Whenever you finish a Short or Long Rest while holding Brewer’s
      Supplies, you can use that tool to magically produce one magical beverage,
      chosen from the following options: Cinnamon Dragon, Heavenly Spirit, or
      Refreshing Dip. The beverage appears in a bottle or cask, and the bottle
      vanishes when the beverage is drunk or poured out. If any beverage remains
      when you finish a Short or Long Rest, the beverage and its container
      vanish.</p><p><em><strong>Drinking a Magical Beverage.</strong></em> Only
      you can gain the benefit of drinking the beverage. You must drink at least
      a pint of the beverage before gaining its benefit. You can spend 1 minute
      drinking a pint of the beverage. You then gain the benefits of the
      beverage for 1 hour, as described below.</p><hr /><p><em><strong>Cinnamon
      Dragon.</strong></em> You can take a Magic action to exhale toxic flames
      in a 30-foot Cone. Each creature makes a Dexterity saving throw (DC 8 plus
      your Wisdom modifier and Proficiency Bonus). On a failed save, a creature
      takes Fire damage equal to four rolls of your Martial Arts die and has the
      Poisoned condition until the end of its next turn. On a successful save, a
      creature takes half as much damage only.</p><p><em><strong>Heavenly
      Spirit.</strong></em> You gain Resistance to Psychic and Radiant
      damage.</p><p><em><strong>Refreshing Dip.</strong></em> Whenever you
      regain Hit Points, you regain additional Hit Points equal to a roll of
      your Martial Arts die.</p><hr /><p><em><strong>Enhancing a Magical
      Beverage.</strong></em> When you create a magical beverage, you can expend
      1 Focus Point. When you do so, the benefit’s duration extends to 8
      hours.</p><section class="secret"
      id="secret-tYE6bxaEjXO1EraO"><p><strong>Foundry Note</strong></p><p>This
      feature as well as Master Brewer are not automated. Simply declare which
      brew you are creating and only use the activity appropriate to the choosen
      brew.</p></section>
