  description:
    value: >-
      <p>You learn more complex flavors. The following beverages are added to
      your
      @UUID[Compendium.UA2025-SubclassUpdates.classes.Item.uamnkMysticBrew0]{Mystic
      Brew} options.</p><hr /><p><em><strong>Blue Lightning.</strong></em>
      Whenever you take a Reaction that isn’t making an Opportunity Attack or
      casting a spell, you can make one Unarmed Strike as part of that
      Reaction.</p><p><em><strong>Drunkard’s Luck.</strong></em> You gain Heroic
      Inspiration if you don’t already have it. In addition, you can give
      yourself Heroic Inspiration when you roll Initiative without it.</p>
