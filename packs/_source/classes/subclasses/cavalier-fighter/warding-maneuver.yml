  description:
    value: >-
      <p>You learn to fend off strikes directed at you, your mount, or other
      creatures nearby. If you or a creature you can see within 5 feet of you is
      hit by an attack roll, you can roll [[/r 1d8]] as a Reaction if you’re
      wielding a Melee weapon or a Shield. Roll the die, and add the number
      rolled to the target’s AC against the triggering attack. If the attack
      still hits, the target has Resistance against the attack’s
      damage.</p><p>You can use this feature a number of times equal to your
      Constitution modifier (minimum of once), and you regain all expended uses
      when you finish a &amp;Reference[Long Rest].</p>
