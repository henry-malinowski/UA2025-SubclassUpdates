  description:
    value: >-
      <p>During the first round of each combat, you and your mount’s Speed
      increases by 10 feet, and your movement doesn’t provoke Opportunity
      Attacks for that round. When you move within 5 feet of a creature this
      round, that creature must succeed on a [[/save str
      dc=@abilities.str.dc]]{Strength saving throw} (DC 8 plus your Strength
      modifier and Proficiency Bonus) or you either push it 5 feet away or cause
      it to have the &amp;Reference[Prone] condition. A creature makes this save
      only once during a turn.</p><section class="secret"
      id="secret-gWykiWDn5EygdfoM"><p><strong>Foundry Note</strong></p><p>This
      feature does not apply a Speed during the first turn of combat, but does
      trigger when combat begins to remind the user of its
      application.</p></section>
