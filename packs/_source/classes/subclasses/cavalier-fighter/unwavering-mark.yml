  description:
    value: >-
      <p>You can menace your foes, foiling their attacks and punishing them for
      harming others. When you hit a creature with a Melee weapon, you can mark
      the creature until the end of your next turn. This effect ends early if
      you have the &amp;Reference[Incapacitated apply=false] condition, you die,
      or someone else marks the creature.</p><p>While it is within 5 feet of
      you, a creature marked by you has Disadvantage on attack rolls against
      creatures other than you.</p><p>In addition, if a creature marked by you
      hits a creature other than you with an attack roll, you have Advantage on
      attack rolls against the marked creature until the end of your next
      turn.</p><section class="secret"
      id="secret-YyHc1cbfbZrKKIeq"><p><strong>Foundry Note</strong></p><p>This
      feature's effects are not automated, but a Mark active effect is available
      with the <strong>Use</strong> activity to aid in remember to whom the
      feature applies.</p></section>
