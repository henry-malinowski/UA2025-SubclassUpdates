    value: >-
      <p>The magic of your oath ensures you always have certain spells ready;
      when you reach a Paladin level specified in the Oathbreaker Spells table,
      you thereafter always have the listed spells
      prepared.</p><table><caption>Oathbreaker
      Spells</caption><thead><tr><td>Paladin
