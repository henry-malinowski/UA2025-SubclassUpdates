  description:
    value: >-
      <p>As a Bonus Action, you can expend one use of your Channel Divinity to
      summon a number of Undead equal to half your Charisma modifier (round up;
      minimum of one Undead summoned). Each Undead appears in an unoccupied
      space you can see within 30 feet of you and is a type of your choice:
      @UUID[Compendium.dnd-players-handbook.actors.Actor.phbmobSkeleton00]{Skeleton}
      or
      @UUID[Compendium.dnd-players-handbook.actors.Actor.phbmobZombie0000]{Zombie}
      (see appendix B of the Player’s Handbook for the stat blocks).</p><p>The
      Undead are under your control for 1 minute, after which they dissolve into
      ash. Each Undead is an ally to you and your allies. In combat, the Undead
      shares your Initiative count, but it takes its turn immediately after
      yours. It obeys your verbal commands (no action required by you). If you
      don’t issue any, it takes the &amp;Reference[Dodge] action and uses its
      movement to avoid danger.</p>
