  description:
    value: >-
      <p>As a Bonus Action, you can imbue your Aura of Protection with unholy
      gloom, granting the benefits below for 10 minutes or until you end them
      (no action required). Once you use this feature, you can’t use it again
      until you finish a Long Rest. You can also restore your use of it by
      expending a level 5 spell slot (no action
      required).</p><p><em><strong>Darkness.</strong></em> Magical Darkness
      fills your
      @UUID[Compendium.dnd-players-handbook.classes.Item.phbpdnProtection]{Aura
      of Protection}. You and allies in your Aura of Protection can see within
      this magical Darkness.</p><p><em><strong>Fear.</strong></em> Whenever a
      creature with the &amp;Reference[Frightened apply=false] condition starts
      its turn in your Aura of Protection, that creature takes [[/damage 4d10
      psychic]] damage.</p><p><em><strong>Shadow Strike.</strong></em> As a
      Bonus Action, you can make a melee spell attack, shaping the gloom exuding
      from you into a blade that targets one creature in your Aura of
      Protection. On a hit, the attack deals Necrotic damage equal to 3d10 plus
      your Charisma modifier.</p>
