  description:
    value: >-
      <blockquote><p>Drink Mystic Brews to Overwhelm and Confound
      Foes</p></blockquote><p>Warriors of Intoxication move with the jerky,
      unpredictable movements typical of someone who is intoxicated. These Monks
      sway on unsteady feet to appear incompetent and then prove themselves
      frustrating to engage. Their apparently erratic stumbles conceal a
      carefully executed dance of blocks, parries, advances, attacks, and
      retreats.</p><p>Warriors of Intoxication often enjoy playing the fool to
      bring gladness to the downtrodden or to teach humility to the arrogant,
      but these Monks are maddening, masterful foes in battle.</p>
