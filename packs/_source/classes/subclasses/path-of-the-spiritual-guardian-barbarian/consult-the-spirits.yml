  description:
    value: >-
      <p>You gain the ability to consult with your guardian spirits. When you do
      so, you cast the
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplAugury0000]{Augury}
      or
      @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplClairvoyan]{Clairvoyance}
      spell, without expending a spell slot or needing Material components.
      Rather than creating a spherical sensor, this use of Clairvoyance
      invisibly summons one of your guardian spirits to the chosen location.
      Wisdom is your spellcasting ability for these spells. After you cast
      either spell in this way, you can’t use this feature again until you
      finish a &amp;Reference[Short Rest]{Short} or &amp;Reference[Long
      Rest].</p>
