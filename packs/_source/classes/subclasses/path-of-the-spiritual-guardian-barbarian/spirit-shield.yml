  description:
    value: >-
      <p>Your guardian spirits can provide supernatural protection to those you
      defend. While your Rage is active, when another creature you can see
      within 30 feet of you takes damage, you can take a Reaction to reduce that
      damage. To determine the amount the damage is reduced by, roll a number of
      d6s equal to your Rage Damage bonus, and add them together.</p><section
      class="secret" id="secret-NNsyDlUjj0lT1Ofg"><p><strong>Foundry
      Note</strong></p><p>This featur offers a heal option to apply as damage
      reduction. If this would cause the attack to apply no damage, don't apply
      the damage of the triggering attack or this healing.</p></section>
