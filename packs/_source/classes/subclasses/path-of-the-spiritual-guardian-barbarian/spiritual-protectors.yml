  description:
    value: >-
      <p>Your Rage summons spectral warriors to your aid. While your Rage is
      active, when you hit a creature with a weapon or an Unarmed Strike, it
      becomes the target of the spirits, which cause one of the following
      effects of your choice.</p><p><em><strong>Distract.</strong></em> Until
      the start of your next turn, the target has Disadvantage attack rolls
      against targets other than you or another Barbarian who has this
      feature.</p><p><em><strong>Protect.</strong></em> Until the end of the
      target’s next turn, the next time it hits a creature other than you with
      an attack roll, that creature has Resistance to the damage dealt by the
      attack.</p><p><em><strong>Strike.</strong></em> The target takes an extra
      1d6 damage, which can be Acid, Cold, Fire, Force, Lightning, or Thunder
      damage (your choice).</p><section class="secret"
      id="secret-Ixxu9ZpPho7zqjMu"><p><strong>Foundry Note</strong></p><p>The
      attack Disadvantage and damage Resistance of the Distract and Protect
      options are not automated, but have an active effect to remember which
      creature the has the debuff applied.</p><p>The Strike option allows you to
      pick the damage type in its roll dialog.</p></section>
