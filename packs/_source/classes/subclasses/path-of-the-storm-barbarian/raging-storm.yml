  description:
    value: >-
      <p>The power of the storm you channel grows mightier, lashing out at your
      foes. The effect is based on the environment you choose for your
      @UUID[Compendium.UA2025-SubclassUpdates.classes.Item.uabrbStormAura00]{Storm
      Aura}.</p><p><em><strong>Desert.</strong></em> Once per turn, when a
      creature you can see fails its saving throw against your Storm Aura
      effect, you can cause it to start &amp;Reference[burning] for 1 minute or
      until your Rage ends. A burning creature takes an extra 1d4 Fire damage
      ([[/damage 2d4 fire]]{2d4 Fire} damage total) at the start of each of its
      turns.</p><p><em><strong>Sea.</strong></em> Whether the target fails or
      succeeds on its saving throw against your Storm Aura effect, a bolt of
      lightning leaps from the target to another target of your choice, which
      must be within 30 feet of the first target. The new target makes the same
      Dexterity saving throw as the first
      target.</p><p><em><strong>Tundra.</strong></em> Once per turn, when a
      creature you can see fails its saving throw against your Storm Aura
      effect, you can cause it to take [[/damage 2d4 cold]]{2d4 Cold} damage and
      its Speed is halved until the end of its next turn.</p>
