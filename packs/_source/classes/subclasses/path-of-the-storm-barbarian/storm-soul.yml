  description:
    value: >-
      <p>The storm grants you benefits even when your aura isn’t active. The
      benefits are based on the environment you chose for your
      @UUID[Compendium.UA2025-SubclassUpdates.classes.Item.uabrbStormAura00]{Storm
      Aura} the last time you entered your
      Rage.</p><p><em><strong>Desert.</strong></em> You gain Resistance to Fire
      damage. As a Magic action, you can touch a flammable object that isn’t
      being worn or carried by anyone else fand cause the object to start
      burning.</p><p><em><strong>Sea.</strong></em> You gain Resistance to
      Lightning damage, and you can breathe underwater. You also gain a Swim
      Speed equal to your Speed.</p><p><em><strong>Tundra.</strong></em> You
      gain Resistance to Cold damage. As a Magic action, you can touch water and
      turn a 5-foot Cube of it into ice, which melts after 1 minute. This action
      fails if a creature is in the Cube.</p><section class="secret"
      id="secret-NbMrhel8Qae61fgt"><p><strong>Foundry Note</strong></p><p>This
      feature includes 3 active effects that can be toggled between to allow
      application of the different damage resistences.</p></section>
