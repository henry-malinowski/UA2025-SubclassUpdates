  description:
    value: >-
      <p>Whenever you activate your Rage, choose Desert, Sea, or Tundra. You
      extend an aura in a 10-foot Emanation originating from yourself for the
      duration of your Rage.</p><p>Your aura has an effect that activates when
      you enter your Rage, and you can activate the effect again on each of your
      turns as a Bonus Action. Your aura’s effect depends on the chosen
      environment, as detailed below.</p><p>If your aura’s effect requires a
      saving throw, the DC equals 8 plus your Proficiency bonus plus your
      Constitution modifier.</p><p><em><strong>Desert.</strong></em> When this
      effect is activated, roll a number of d4s equal to your Rage Damage bonus,
      and add them together. Each creature in the aura must succeed on a
      Dexterity saving throw or take Fire damage equal to the number rolled. You
      can choose one creature you can see in your aura to automatically succeed
      on this saving throw.</p><p><em><strong>Sea.</strong></em> When this
      effect is activated, roll a number of d6s equal to your Rage Damage bonus,
      and add them together. You can then hurl a bolt of lightning at one other
      creature you can see within your aura. The target makes a Dexterity saving
      throw, taking Lightning damage equal to the number rolled on a failed
      save, or half as much damage on a successful one.
      </p><p><em><strong>Tundra.</strong></em> When this effect is activated,
      roll a number of d4s equal to your Rage Damage bonus, and add them
      together. You can choose one other creature you can see within your aura
      to harry with icy spirits. The target must succeed on a Strength saving
      throw or it subtracts the number rolled from the next damage roll it makes
      before the start of your next turn.</p>
