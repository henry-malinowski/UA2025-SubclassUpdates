  description:
    value: >-
      <blockquote><p>Obtain Great Power at Any Cost</p></blockquote><p>The power
      of a Paladin’s oath is so great that it holds a distorted power even when
      it is violated. When a Paladin betrays the tenets of their oath because of
      corruption, pride, or thirst for power, they lose the blessing granted by
      their original oath but sometimes take on the sinister blessing of the
      Oathbreaker in its place. Oathbreakers use fear and overwhelming power to
      achieve their goals. While many Oathbreakers are beyond redemption, some
      Paladins bend this oath to achieve a great and noble deed to atone for
      their past evils.</p><p>At the DM’s discretion, a Paladin of any level who
      violates the tenets of their oath can lose the benefits granted by their
      original subclass and gain the features of the Oathbreaker subclass
      instead. Alternatively, a Paladin can choose this subclass at level 3
      based on the character’s backstory of falling from grace.</p><p>These
      Paladins often share the following tenets:</p><p>• Fear is a tool in the
      hands of the powerful.</p><p>• Strive for power at any cost.</p><p>• Do
      what must be done, but never lose sight of your goal.</p>
