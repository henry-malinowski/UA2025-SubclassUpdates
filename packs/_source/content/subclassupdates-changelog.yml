        <h3>Added</h3><ul><li><p>Auto-opening Journal based
        Changelog</p></li><li><p>Page numbers to
        Features</p></li></ul><h3>Changed</h3><ul><li><p>Moved VSC from binary
        leveldb files to YAML files</p></li><li><p>Moved subclass spell lists as
        Item Grant advancements to the X Spells feature instead of Class
        progression</p></li><li><p>Defined deterministic
        UUIDs</p><ul><li><p>This is a breaking
        change</p></li></ul></li><li><p>Reorganized/normalized compendium pack
        structure</p></li></ul><h3>Fixed</h3><ul><li><p>Removed erroneous
        Charisma stat casting requirement from Oathbreaker spells</p></li></ul>
