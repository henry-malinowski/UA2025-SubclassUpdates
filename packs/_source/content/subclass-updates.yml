      description:
        value: >-
          <blockquote><p>Call on the Spirits for Combat
          Aid</p></blockquote><p>Barbarians who walk the Path of the Spiritual
          Guardian call upon spirits—whether bestial spirits of nature, spirits
          of departed ancestors, or spirits of raw elemental power—to guide and
          protect them. When these Barbarians rage, they contact the realm of
          the spirits and call on them for aid.</p>
